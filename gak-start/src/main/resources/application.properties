server.port=8080
spring.application.name=gnomish-army-knife

# 本地开发使用默认值，Docker/NAS 部署时通过环境变量覆盖。
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/mydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:millerchu}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver
mybatis-plus.configuration.map-underscore-to-camel-case=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
gak.app.icon.local-dir=${GAK_APP_ICON_LOCAL_DIR:./data/app-icons}
gak.app.icon.public-url-prefix=${GAK_APP_ICON_PUBLIC_URL_PREFIX:/api/system/apps/icon-files/}
gak.data-migration.storage-dir=${GAK_DATA_MIGRATION_STORAGE_DIR:./data/data-migrations}
gak.data-migration.public-url-prefix=${GAK_DATA_MIGRATION_PUBLIC_URL_PREFIX:/api/system/data-migrations/tasks/}
gak.health.file.local-dir=${GAK_HEALTH_FILE_LOCAL_DIR:./data/health-records}
gak.health.file.public-url-prefix=${GAK_HEALTH_FILE_PUBLIC_URL_PREFIX:/api/health-records/report-files/}
