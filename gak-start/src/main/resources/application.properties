server.port=8080
spring.application.name=gnomish-army-knife

# 本地开发使用默认值，Docker/NAS 部署时通过环境变量覆盖。
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/mydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:millerchu}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver
mybatis-plus.configuration.map-underscore-to-camel-case=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
gak.attachment.storage-root=${GAK_ATTACHMENT_STORAGE_ROOT:./data}
gak.attachment.cleanup-cron=${GAK_ATTACHMENT_CLEANUP_CRON:0 30 3 * * *}
gak.attachment.legacy-migration-enabled=${GAK_ATTACHMENT_LEGACY_MIGRATION_ENABLED:true}
gak.app.icon.local-dir=${GAK_APP_ICON_LOCAL_DIR:./data/app-icons}
gak.app.icon.public-url-prefix=${GAK_APP_ICON_PUBLIC_URL_PREFIX:/api/system/apps/icon-files/}
gak.data-migration.storage-dir=${GAK_DATA_MIGRATION_STORAGE_DIR:./data/data-migrations}
gak.data-migration.public-url-prefix=${GAK_DATA_MIGRATION_PUBLIC_URL_PREFIX:/api/system/data-migrations/tasks/}
gak.health.file.local-dir=${GAK_HEALTH_FILE_LOCAL_DIR:./data/health-records}
gak.health.file.public-url-prefix=${GAK_HEALTH_FILE_PUBLIC_URL_PREFIX:/api/health-records/report-files/}
gak.fuel-price.juhe-api-key=${GAK_FUEL_PRICE_JUHE_API_KEY:}
gak.fuel-price.juhe-api-url=${GAK_FUEL_PRICE_JUHE_API_URL:https://apis.juhe.cn/gnyj/query}
gak.fuel-price.cache-minutes=${GAK_FUEL_PRICE_CACHE_MINUTES:30}
# 系统异常日志限制新写入数量；按上海时间清理默认关闭，开启前由表属主执行 docs/sql 清理函数脚本。
# 开启清理时 retention-days 必须 >=30；严格早于截止时间才删除。
gak.system-log.max-rows=${GAK_SYSTEM_LOG_MAX_ROWS:20000}
gak.system-log.retention-days=${GAK_SYSTEM_LOG_RETENTION_DAYS:30}
gak.system-log.cleanup.enabled=${GAK_SYSTEM_LOG_CLEANUP_ENABLED:false}
gak.system-log.cleanup.cron=${GAK_SYSTEM_LOG_CLEANUP_CRON:0 10 4 * * *}
gak.system-log.cleanup.batch-size=${GAK_SYSTEM_LOG_CLEANUP_BATCH_SIZE:500}
gak.system-log.cleanup.max-batches-per-run=${GAK_SYSTEM_LOG_CLEANUP_MAX_BATCHES_PER_RUN:40}
gak.system-log.cleanup.batch-interval-ms=${GAK_SYSTEM_LOG_CLEANUP_BATCH_INTERVAL_MS:100}
gak.system-log.cleanup.statement-timeout=${GAK_SYSTEM_LOG_CLEANUP_STATEMENT_TIMEOUT:10s}
